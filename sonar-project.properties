# SonarCloud Project Configuration for Prados2_Frontend
sonar.projectKey=prados2_frontend
sonar.organization=prados2-org

# Information
sonar.projectName=Prados del Portal 2 - Frontend
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.spec.js

# Encoding & Language Settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/*.config.mjs,**/*.config.js
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/.next/**,**/public/**

# Coverage Report Path
sonar.javascript.lcov.reportPaths=coverage/lcov.info
